<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Scanner</title>
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background-color: #1e1e1e;
            padding: 15px 20px;
            font-size: 18px;
            font-weight: 500;
            border-bottom: 1px solid #2c2c2c;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        .result-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .result-type {
            font-size: 12px;
            text-transform: uppercase;
            color: #aaaaaa;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .result-link {
            font-size: 16px;
            color: #4dabf7;
            word-break: break-all;
            text-decoration: underline;
            line-height: 1.4;
            display: block;
            margin-bottom: 15px;
        }

        .result-link:hover {
            color: #74c0fc;
        }

        .action-buttons {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2c2c2c;
        }

        .action-btn {
            background: none;
            border: none;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            font-size: 12px;
            cursor: pointer;
            padding: 0;
        }

        .action-icon {
            width: 36px;
            height: 36px;
            background-color: #2b3a4a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4dabf7;
            font-size: 16px;
        }

        .scanner-section {
            background-color: #1e1e1e;
            border-radius: 12px;
            overflow: hidden;
            padding: 15px;
            text-align: center;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: none !important;
        }

        #reader__dashboard_section_csr button, 
        #reader button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }

        .file-upload-container {
            margin-top: 15px;
            text-align: center;
        }

        .file-upload-label {
            background-color: #2c2c2c;
            color: #ffffff;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-block;
            font-size: 14px;
        }

        .file-upload-label:hover {
            background-color: #3c3c3c;
        }

        #qr-input-file {
            display: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <span>Scan</span>
    </div>

    <div class="content">
        <!-- Result Card -->
        <div class="result-card">
            <div class="result-type">URL</div>
            <a id="result-link" class="result-link" href="#" target="_blank" style="display: none;">Waiting for scan...</a>
            <div id="result-placeholder" style="color: #777; font-size: 14px; margin-bottom: 15px;">Point back camera at a QR code or upload an image</div>
            
            <div class="action-buttons">
                <button class="action-btn" onclick="openLink()" id="open-btn" disabled style="opacity: 0.5;">
                    <div class="action-icon">↗</div>
                    Open
                </button>
                <button class="action-btn" onclick="shareLink()" id="share-btn" disabled style="opacity: 0.5;">
                    <div class="action-icon">-</div>
                    Share
                </button>
                <button class="action-btn" onclick="copyLink()" id="copy-btn" disabled style="opacity: 0.5;">
                    <div class="action-icon">📋</div>
                    Copy
                </button>
            </div>
        </div>

        <!-- Scanner Viewport -->
        <div class="scanner-section">
            <div id="reader"></div>
            
            <div class="file-upload-container">
                <label class="file-upload-label" for="qr-input-file">Browse QR Image</label>
                <input type="file" id="qr-input-file" accept="image/*">
            </div>
        </div>
    </div>

    <script>
        let scannedUrl = "";

        function handleScanResult(decodedText) {
            scannedUrl = decodedText;
            const linkElement = document.getElementById('result-link');
            const placeholder = document.getElementById('result-placeholder');
            const openBtn = document.getElementById('open-btn');
            const shareBtn = document.getElementById('share-btn');
            const copyBtn = document.getElementById('copy-btn');

            linkElement.href = decodedText;
            linkElement.innerText = decodedText;
            linkElement.style.display = "block";
            placeholder.style.display = "none";

            // Enable action buttons
            [openBtn, shareBtn, copyBtn].forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = "1";
            });
        }

        function openLink() {
            if (scannedUrl) {
                window.open(scannedUrl, '_blank');
            }
        }

        function shareLink() {
            if (scannedUrl && navigator.share) {
                navigator.share({
                    title: 'Scanned QR Code',
                    url: scannedUrl
                }).catch(console.error);
            } else {
                copyLink();
                alert("Link copied to clipboard for sharing!");
            }
        }

        function copyLink() {
            if (scannedUrl) {
                navigator.clipboard.writeText(scannedUrl).then(() => {
                    alert("Copied to clipboard!");
                });
            }
        }

        // Initialize Live Camera Scanner forcing the rear/back camera
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { 
                fps: 10, 
                qrbox: { width: 220, height: 220 },
                // Forces the back camera configuration on mobile devices
                videoConstraints: {
                    facingMode: "environment"
                }
            },
            false
        );
        html5QrcodeScanner.render((decodedText) => {
            handleScanResult(decodedText);
        }, (err) => {});

        // Handle File Browsing Option
        const fileInput = document.getElementById('qr-input-file');
        fileInput.addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            
            const imageFile = e.target.files[0];
            const html5QrCode = new Html5Qrcode("reader");
            
            html5QrCode.scanFile(imageFile, true)
                .then(decodedText => {
                    handleScanResult(decodedText);
                })
                .catch(err => {
                    alert(`Could not read QR code from image: ${err}`);
                });
        });
    </script>
    <script>
    // Disable right-click context menu
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, etc.
    document.addEventListener("keydown", function(e) {
        // F12 key
        if (e.key === "F12") {
            e.preventDefault();
        }
        
        // Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C (Chrome/Edge/Firefox DevTools)
        if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) {
            e.preventDefault();
        }
        
        // Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === "U" || e.key === "u")) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
