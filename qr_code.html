<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish QR Code Generator (JPG with Border)</title>
    <!-- Include qrcode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #cbd5e1;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 480px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            color: #0f172a;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .designs-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .design-card {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .design-card.active {
            border-color: var(--primary);
            background-color: #eef2ff;
            color: var(--primary);
        }

        .preview-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 12px;
            min-height: 200px;
        }

        /* QR Code wrapper with border and border-radius */
        #qrcode {
            display: inline-block;
            padding: 15px;
            background: white;
            border: 4px solid var(--primary);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        #qrcode img {
            display: block;
            border-radius: 4px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>QR Code Generator</h2>
        
        <div class="form-group">
            <label for="urlInput">Paste your URL or Text:</label>
            <input type="text" id="urlInput" placeholder="https://esmartcalc.netlify.app/">
        </div>

        <div class="form-group">
            <label>Select Design Template:</label>
            <div class="designs-grid">
                <div class="design-card active" onclick="setDesign('#000000', '#ffffff', '#000000', this)">
                    Classic Dark
                </div>
                <div class="design-card" onclick="setDesign('#4f46e5', '#ffffff', '#4f46e5', this)">
                    Modern Indigo
                </div>
                <div class="design-card" onclick="setDesign('#059669', '#ffffff', '#059669', this)">
                    Forest Green
                </div>
            </div>
        </div>

        <div class="preview-container">
            <div id="qrcode"></div>
        </div>

        <button id="downloadBtn" onclick="downloadQRCodeAsJPG()">Download QR Code (JPG)</button>
    </div>

    <script>
        let fgColor = "#000000";
        let bgColor = "#ffffff";
        let borderColor = "#000000";

        // Initialize QR Code instance
        const qrcodeContainer = document.getElementById("qrcode");
        const qrCode = new QRCode(qrcodeContainer, {
            text: document.getElementById("urlInput").value,
            width: 220,
            height: 220,
            colorDark: fgColor,
            colorLight: bgColor,
            correctLevel: QRCode.CorrectLevel.H
        });

        // Update QR code on input change
        document.getElementById("urlInput").addEventListener("input", function (e) {
            const val = e.target.value.trim();
            qrCode.makeCode(val ? val : " ");
        });

        // Handle Design selection
        function setDesign(dark, light, border, element) {
            fgColor = dark;
            bgColor = light;
            borderColor = border;

            // Update border color dynamically to match theme
            qrcodeContainer.style.borderColor = borderColor;

            // Update active styles on cards
            document.querySelectorAll('.design-card').forEach(card => {
                card.classList.remove('active');
            });
            element.classList.add('active');

            // Re-generate QR code with new colors
            updateQRCodeStyling();
        }

        function updateQRCodeStyling() {
            const currentText = document.getElementById("urlInput").value.trim();
            
            // Clear contents except internal elements if needed, or re-initialize wrapper
            qrcodeContainer.innerHTML = ""; 
            
            new QRCode(qrcodeContainer, {
                text: currentText ? currentText : " ",
                width: 220,
                height: 220,
                colorDark: fgColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        // Download functionality converted to JPG with rounded border drawn onto canvas
        function downloadQRCodeAsJPG() {
            const img = qrcodeContainer.querySelector("img");
            if (!img) return;

            // Create a canvas large enough to hold padding and border
            const padding = 20;
            const borderWidth = 6;
            const canvas = document.createElement("canvas");
            const qrSize = img.naturalWidth || 220;
            
            canvas.width = qrSize + (padding * 2) + (borderWidth * 2);
            canvas.height = qrSize + (padding * 2) + (borderWidth * 2);
            const ctx = canvas.getContext("2d");

            // Fill entire JPG background white
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw rounded rectangle container with border and radius
            const radius = 24; // Smooth border-radius
            const x = borderWidth / 2;
            const y = borderWidth / 2;
            const w = canvas.width - borderWidth;
            const h = canvas.height - borderWidth;

            ctx.beginPath();
            ctx.roundRect(x, y, w, h, radius);
            ctx.fillStyle = bgColor;
            ctx.fill();
            ctx.lineWidth = borderWidth;
            ctx.strokeStyle = borderColor;
            ctx.stroke();

            // Draw the inner QR code image centered
            ctx.drawImage(img, padding + borderWidth, padding + borderWidth);

            // Convert canvas to JPG data URL
            const jpgUrl = canvas.toDataURL("image/jpeg", 1.0);

            // Trigger download
            const link = document.createElement("a");
            link.href = jpgUrl;
            link.download = "styled-qrcode.jpg";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
<script>
    // Disable right-click context menu
    document.addEventListener("contextmenu", function(e) {
      e.preventDefault();
    });

    // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U, etc.
    document.addEventListener("keydown", function(e) {
        // F12 key
        if (e.key === "F12") {
            e.preventDefault();
        }
        
        // Ctrl+Shift+I or Ctrl+Shift+J or Ctrl+Shift+C (Chrome/Edge/Firefox DevTools)
        if (e.ctrlKey && e.shiftKey && (e.key === "I" || e.key === "i" || e.key === "J" || e.key === "j" || e.key === "C" || e.key === "c")) {
            e.preventDefault();
        }
        
        // Ctrl+U (View Source)
        if (e.ctrlKey && (e.key === "U" || e.key === "u")) {
            e.preventDefault();
        }
    });
</script>
</body>
</html>
